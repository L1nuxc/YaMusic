[package]
name = "yamusic-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tower = { version = "0.5", features = ["util"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
rubato = "0.16"
rustfft = "6"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
linfa = "0.8"
linfa-clustering = "0.8"
ndarray = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
