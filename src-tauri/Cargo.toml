[package]
name = "yamusic-desktop"
version = "0.2.0"
description = "YaMusic for Windows"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[profile.release]
strip = "symbols"
